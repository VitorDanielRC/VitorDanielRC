name: Cyberpunk contribution snake

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: cyberpunk-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate neon contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VitorDanielRC
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23d82a78&color_dots=%23eef2f6,%23b5e7eb,%2361c9d5,%230d94a5,%23005767
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff328c&color_dots=%23161926,%230e3d4d,%230b7285,%2300b8d4,%2300f5ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
